<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>D3 project</title>
    <link rel="icon" href="data:," />
    <link rel="stylesheet" href="/game/style.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
      href="https://fonts.googleapis.com/css2?family=Science+Gothic:wght@100..900&display=swap"
      rel="stylesheet">
  </head>
  <body>
    <main id="app">
      <div id="winBanner" hidden>
        <h1>VICTORY</h1>
        <p>You crafted the thrusters and repaired the rocketship. With the help of local goo, you have enough fuel to make the journey back home. <br><br>You win!</p>
      </div>
      <div id="grid"></div>
      <aside id="hud">
        <dl>
          <dt>Position</dt>
          <dd id="position"></dd>
          <dt>Terrain</dt>
          <dd id="terrain"></dd>
        </dl>
        <p id="live" aria-live="polite"></p>
        <button id="mute" type="button" aria-pressed="false">Sound: on</button>
        <ul id="inventory"></ul>
        <ul id="recipes"></ul>
      </aside>
    </main>
    <script type="module" src="/game/main.ts"></script>
  </body>
</html>
